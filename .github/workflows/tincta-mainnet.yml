name: Tincta Mainnet preparation
on:
  workflow_dispatch:
  push:
    paths: ['apps/contracts/contracts/Tincta*.sol', 'apps/contracts/test/Tincta*.ts', 'apps/contracts/hardhat.config.ts', 'packages/protocol/src/tincta*.ts', 'packages/contracts/src/tincta-rewards-*.json', 'scripts/tincta/**', '.github/workflows/tincta-mainnet.yml']
permissions:
  contents: read
jobs:
  fork:
    name: Read-only Mainnet fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAINNET_FORK_URL: http://127.0.0.1:18547
      MAINNET_FORK_BLOCK: '26304305'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec --workspace @manekineko/contracts -- hardhat build contracts/TinctaRewards.sol contracts/TinctaEngine.sol --no-tests
      - name: Test the real coordinator on a disposable fork
        run: |
          node scripts/tincta/fork-rpc.mjs > fork-transport.log 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:18547 | grep -q '0x1'; then break; fi
            sleep 1
          done
          npm exec --workspace @manekineko/contracts -- hardhat test --no-compile test/TinctaMainnetFork.ts
      - run: node scripts/tincta/export.mjs --check
