name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test apps/launch/test/social-sender.test.ts
        env:
          TEST_SOCIAL_DATABASE: '1'
          DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/postgres
      - run: npm run protocol:v17:rehearsal:test
      - run: npm run check
      - run: npm run protocol:v12:test
      - run: node --import tsx --test scripts/protocol-v13/rehearsal/rehearsal.test.mts
      - run: node --import tsx --test scripts/protocol-v14/rehearsal/rehearsal.test.mts
      - run: npm run protocol:workers:typecheck
      - run: npm run season:typecheck
      - run: node --import tsx --test --test-concurrency=1 scripts/season-runner/*.test.ts
      - run: npm run contracts:export
      - run: npm run protocol:v14:sources:test
      - run: git diff --exit-code -- packages/contracts/src
