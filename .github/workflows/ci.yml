name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run protocol:v17:rehearsal:test
      - run: npm run check
      - run: npm run protocol:v12:test
      - run: node --import tsx --test scripts/protocol-v13/rehearsal/rehearsal.test.mts
      - run: node --import tsx --test scripts/protocol-v14/rehearsal/rehearsal.test.mts
      - run: npm run protocol:workers:typecheck
      - run: npm run season:typecheck
      - run: node --import tsx --test --test-concurrency=1 scripts/season-runner/*.test.ts
      - run: npm run contracts:export
      - run: npm run protocol:v14:sources:test
      - run: git diff --exit-code -- packages/contracts/src
