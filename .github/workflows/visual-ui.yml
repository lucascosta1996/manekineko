name: Visual UI contracts
on:
  pull_request:
    paths: ['apps/web/**', 'apps/launch/**', 'apps/landing-page/**', 'packages/ui/**', 'packages/protocol/**', 'scripts/protocol-v12/**', 'tests/visual/**', 'scripts/visual/**', 'playwright.config.ts', 'package.json', 'package-lock.json', 'docs/design/**', 'scripts/generate-tincta-brand.mjs', 'scripts/generate-landing-artwork.mjs', 'packages/contracts/src/tincta-artwork.ts', 'packages/contracts/src/season-appearance.ts', 'packages/contracts/src/permanent-combinations.ts', 'docs/brand/tincta/identity/**', 'seasons.json', 'collection-names.json', '.github/workflows/visual-ui.yml']
  push:
    paths: ['apps/web/**', 'apps/launch/**', 'apps/landing-page/**', 'packages/ui/**', 'packages/protocol/**', 'scripts/protocol-v12/**', 'tests/visual/**', 'scripts/visual/**', 'playwright.config.ts', 'package.json', 'package-lock.json', 'scripts/generate-tincta-brand.mjs', 'scripts/generate-landing-artwork.mjs', 'packages/contracts/src/tincta-artwork.ts', 'packages/contracts/src/season-appearance.ts', 'packages/contracts/src/permanent-combinations.ts', 'docs/brand/tincta/identity/**', 'seasons.json', 'collection-names.json', '.github/workflows/visual-ui.yml']
permissions:
  contents: read
jobs:
  visual:
    name: visual (${{ matrix.browser }}, ${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: '1/1', part: 1, workers: 2 }
          - { browser: webkit, shard: '1/1', part: 1, workers: 2 }
          # Firefox's startup reads compete with three application servers and video.
          # Isolate its workers while preserving the complete test set and wall-clock bounds.
          - { browser: firefox, shard: '1/2', part: 1, workers: 1 }
          - { browser: firefox, shard: '2/2', part: 2, workers: 1 }
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      - run: npm run ui:source
      - run: npm run ui:typecheck
      - run: node scripts/generate-tincta-brand.mjs --check
      - run: node --import tsx scripts/generate-landing-artwork.mjs --check
      - run: npm run landing:test && npm run web:test && npm run launch:test && npm run protocol:v12:test
      - run: npm run typecheck --workspace @manekineko/landing-page && npm run typecheck --workspace @manekineko/web && npm run typecheck --workspace @manekineko/launch
      - run: npm run build:landing && npm run build:web && npm run build:launch
      - run: npm run ui:fixtures:build
      - run: npm run ui:test -- --project=${{ matrix.browser }} --workers=${{ matrix.workers }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-ui-${{ github.sha }}-${{ matrix.browser }}-${{ matrix.part }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
