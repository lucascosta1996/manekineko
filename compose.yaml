name: manekineko

services:
  database:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_DB: manekineko
      POSTGRES_USER: manekineko
      # Development only. Production uses a managed DATABASE_URL.
      POSTGRES_PASSWORD: manekineko-local-only
    volumes:
      - manekineko-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manekineko -d manekineko"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  manekineko-postgres:
