<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1190" viewBox="0 0 1800 1190" role="img" aria-labelledby="title"><title id="title">Tincta shortlisted logo construction sketches</title><style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style><rect width="1800" height="1190" fill="#FAFAF7"/><text x="64" y="95" font-size="57" fill="#1A1A1A" letter-spacing="-2">Two directions, six constructions.</text><text x="64" y="147" font-size="24" fill="#696963" >03 / Contour T     +     02 / Ribbon T</text><path d="M64 202H584" stroke="#DADAD3"/><text x="64" y="249" font-size="29" fill="#1A1A1A" >03A / Single contour</text><g transform="translate(227 286) scale(1.8)" color="#1A1A1A"><path fill="currentColor" fill-rule="evenodd" d="M8 10H92V46H70V90H30V46H8ZM20 22H80V34H58V78H42V34H20Z"/></g><text x="64" y="514" font-size="20" fill="#696963" >Recommended balance of mass and open space.</text><text x="231" y="591" font-size="16" fill="#696963" class="mono">32</text><g transform="translate(278 566) scale(0.32)" color="#1A1A1A"><path fill="currentColor" fill-rule="evenodd" d="M8 10H92V46H70V90H30V46H8ZM20 22H80V34H58V78H42V34H20Z"/></g><text x="357" y="591" font-size="16" fill="#696963" class="mono">64</text><g transform="translate(400 546) scale(0.64)" color="#1A1A1A"><path fill="currentColor" fill-rule="evenodd" d="M8 10H92V46H70V90H30V46H8ZM20 22H80V34H58V78H42V34H20Z"/></g><path d="M636 202H1156" stroke="#DADAD3"/><text x="636" y="249" font-size="29" fill="#1A1A1A" >03B / Soft inner corners</text><g transform="translate(799 286) scale(1.8)" color="#1A1A1A"><path fill="currentColor" fill-rule="evenodd" d="M8 10H92V46H76Q70 46 70 52V90H30V52Q30 46 24 46H8ZM20 22H80V34H64Q58 34 58 40V78H42V40Q42 34 36 34H20Z"/></g><text x="636" y="514" font-size="20" fill="#696963" >A warmer junction; preserve the T inside the T.</text><text x="803" y="591" font-size="16" fill="#696963" class="mono">32</text><g transform="translate(850 566) scale(0.32)" color="#1A1A1A"><path fill="currentColor" fill-rule="evenodd" d="M8 10H92V46H76Q70 46 70 52V90H30V52Q30 46 24 46H8ZM20 22H80V34H64Q58 34 58 40V78H42V40Q42 34 36 34H20Z"/></g><text x="929" y="591" font-size="16" fill="#696963" class="mono">64</text><g transform="translate(972 546) scale(0.64)" color="#1A1A1A"><path fill="currentColor" fill-rule="evenodd" d="M8 10H92V46H76Q70 46 70 52V90H30V52Q30 46 24 46H8ZM20 22H80V34H64Q58 34 58 40V78H42V40Q42 34 36 34H20Z"/></g><path d="M1208 202H1728" stroke="#DADAD3"/><text x="1208" y="249" font-size="29" fill="#1A1A1A" >03C / Double contour</text><g transform="translate(1371 286) scale(1.8)" color="#1A1A1A"><path fill="none" stroke="currentColor" stroke-width="4" d="M8 10H92V46H70V90H30V46H8ZM17 19H83V37H61V81H39V37H17ZM26 28H74M50 28V72"/></g><text x="1208" y="514" font-size="20" fill="#696963" >Closer to the NFT linework; weaker at small sizes.</text><text x="1375" y="591" font-size="16" fill="#696963" class="mono">32</text><g transform="translate(1422 566) scale(0.32)" color="#1A1A1A"><path fill="none" stroke="currentColor" stroke-width="4" d="M8 10H92V46H70V90H30V46H8ZM17 19H83V37H61V81H39V37H17ZM26 28H74M50 28V72"/></g><text x="1501" y="591" font-size="16" fill="#696963" class="mono">64</text><g transform="translate(1544 546) scale(0.64)" color="#1A1A1A"><path fill="none" stroke="currentColor" stroke-width="4" d="M8 10H92V46H70V90H30V46H8ZM17 19H83V37H61V81H39V37H17ZM26 28H74M50 28V72"/></g><path d="M64 655H584" stroke="#DADAD3"/><text x="64" y="702" font-size="29" fill="#1A1A1A" >02A / Flowing ribbon</text><g transform="translate(227 739) scale(1.8)" color="#1A1A1A"><path fill="currentColor" d="M8 16H92V36H65C65 62 56 80 38 90L26 73C39 65 44 53 44 36H8Z"/></g><text x="64" y="967" font-size="20" fill="#696963" >The most fluid and asymmetric construction.</text><text x="231" y="1044" font-size="16" fill="#696963" class="mono">32</text><g transform="translate(278 1019) scale(0.32)" color="#1A1A1A"><path fill="currentColor" d="M8 16H92V36H65C65 62 56 80 38 90L26 73C39 65 44 53 44 36H8Z"/></g><text x="357" y="1044" font-size="16" fill="#696963" class="mono">64</text><g transform="translate(400 999) scale(0.64)" color="#1A1A1A"><path fill="currentColor" d="M8 16H92V36H65C65 62 56 80 38 90L26 73C39 65 44 53 44 36H8Z"/></g><path d="M636 655H1156" stroke="#DADAD3"/><text x="636" y="702" font-size="29" fill="#1A1A1A" >02B / Quiet bend</text><g transform="translate(799 739) scale(1.8)" color="#1A1A1A"><path fill="currentColor" d="M8 16H92V36H63V63Q63 84 44 90L35 72Q43 69 43 60V36H8Z"/></g><text x="636" y="967" font-size="20" fill="#696963" >More upright; easier to recognize as a T.</text><text x="803" y="1044" font-size="16" fill="#696963" class="mono">32</text><g transform="translate(850 1019) scale(0.32)" color="#1A1A1A"><path fill="currentColor" d="M8 16H92V36H63V63Q63 84 44 90L35 72Q43 69 43 60V36H8Z"/></g><text x="929" y="1044" font-size="16" fill="#696963" class="mono">64</text><g transform="translate(972 999) scale(0.64)" color="#1A1A1A"><path fill="currentColor" d="M8 16H92V36H63V63Q63 84 44 90L35 72Q43 69 43 60V36H8Z"/></g><path d="M1208 655H1728" stroke="#DADAD3"/><text x="1208" y="702" font-size="29" fill="#1A1A1A" >02C / Split band</text><g transform="translate(1371 739) scale(1.8)" color="#1A1A1A"><path fill="currentColor" d="M8 16H92V25H8ZM8 31H92V40H65C64 63 56 80 38 90L26 73C39 65 44 53 44 40H8Z"/></g><text x="1208" y="967" font-size="20" fill="#696963" >A narrow cut introduces an edition-like repeat.</text><text x="1375" y="1044" font-size="16" fill="#696963" class="mono">32</text><g transform="translate(1422 1019) scale(0.32)" color="#1A1A1A"><path fill="currentColor" d="M8 16H92V25H8ZM8 31H92V40H65C64 63 56 80 38 90L26 73C39 65 44 53 44 40H8Z"/></g><text x="1501" y="1044" font-size="16" fill="#696963" class="mono">64</text><g transform="translate(1544 999) scale(0.64)" color="#1A1A1A"><path fill="currentColor" d="M8 16H92V25H8ZM8 31H92V40H65C64 63 56 80 38 90L26 73C39 65 44 53 44 40H8Z"/></g><text x="64" y="1150" font-size="21" fill="#696963" >Construction sketches. Optical masters still require final spacing and pixel fitting.</text></svg>
