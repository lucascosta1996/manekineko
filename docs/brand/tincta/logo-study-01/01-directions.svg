d="M8 16H92V36H65C65 62 56 80 38 90L26 73C39 65 44 53 44 36H8Z"/></g><g transform="translate(735 615) scale(0.43)" color="#1A1A1A"><path fill="currentColor" d="M8 16H92V36H65C65 62 56 80 38 90L26 73C39 65 44 53 44 36H8Z"/></g><text x="793" y="657" font-size="61" fill="#1A1A1A" font-weight="600" letter-spacing="-2.8">Tincta</text><text x="636" y="738" font-size="22" fill="#1A1A1A" >A color band bends into a signature.</text><text x="636" y="773" font-size="21" fill="#696963" >More movement; a softer collectible voice.</text><path d="M1180 285V803" stroke="#DADAD3"/><text x="1208" y="315" font-size="29" fill="#1A1A1A" font-weight="500">03 / Contour T</text><text x="1208" y="349" font-size="16" fill="#696963" class="mono" letter-spacing="1">RECOMMENDED</text><g transform="translate(1374 385) scale(1.74)" color="#1A1A1A"><path fill="currentColor" fill-rule="evenodd" d="M8 10H92V46H70V90H30V46H8ZM20 22H80V34H58V78H42V34H20Z"/></g><g transform="translate(1307 615) scale(0.43)" color="#1A1A1A"><path fill="currentColor" fill-rule="evenodd" d="M8 10H92V46H70V90H30V46H8ZM20 22H80V34H58V78H42V34H20Z"/></g><text x="1365" y="657" font-size="61" fill="#1A1A1A" font-weight="600" letter-spacing="-2.8">Tincta</text><text x="1208" y="738" font-size="22" fill="#1A1A1A" >An outer T holds a second T in the counter.</text><text x="1208" y="773" font-size="21" fill="#696963" >The artwork’s contour language, made compact.</text><text x="64" y="876" font-size="29" fill="#1A1A1A" font-weight="500">04 / Four fields</text><text x="64" y="910" font-size="16" fill="#696963" class="mono" letter-spacing="1">CONCEPTUAL</text><g transform="translate(230 946) scale(1.74)" color="#1A1A1A"><path fill="currentColor" d="M10 10H46V30H10ZM54 10H90V30H54ZM10 42H38V90H10ZM62 42H90V90H62Z"/></g><g transform="translate(163 1176) scale(0.43)" color="#1A1A1A"><path fill="currentColor" d="M10 10H46V30H10ZM54 10H90V30H54ZM10 42H38V90H10ZM62 42H90V90H62Z"/></g><text x="221" y="1218" font-size="61" fill="#1A1A1A" font-weight="600" letter-spacing="-2.8">Tincta</text><text x="64" y="1299" font-size="22" fill="#1A1A1A" >Four fields around a shared negative-space T.</text><text x="64" y="1334" font-size="21" fill="#696963" >A nod to identity without using literal numbers.</text><path d="M608 846V1364" stroke="#DADAD3"/><text x="636" y="876" font-size="29" fill="#1A1A1A" font-weight="500">05 / Edition seal</text><text x="636" y="910" font-size="16" fill="#696963" class="mono" letter-spacing="1">COLLECTIBLE</text><g transform="translate(802 946) scale(1.74)" color="#1A1A1A"><path fill="currentColor" fill-rule="evenodd" d="M14 6H86V94H14ZM23 15V85H77V15ZM29 25H71V37H56V73H44V37H29Z"/></g><g transform="translate(735 1176) scale(0.43)" color="#1A1A1A"><path fill="currentColor" fill-rule="evenodd" d="M14 6H86V94H14ZM23 15V85H77V15ZM29 25H71V37H56V73H44V37H29Z"/></g><text x="793" y="1218" font-size="61" fill="#1A1A1A" font-weight="600" letter-spacing="-2.8">Tincta</text><text x="636" y="1299" font-size="22" fill="#1A1A1A" >A portrait frame becomes a publisher’s seal.</text><text x="636" y="1334" font-size="21" fill="#696963" >An art-edition reading, with a compact footprint.</text><path d="M1180 846V1364" stroke="#DADAD3"/><text x="1208" y="876" font-size="29" fill="#1A1A1A" font-weight="500">06 / Drawn signature</text><text x="1208" y="910" font-size="16" fill="#696963" class="mono" letter-spacing="1">TYPOGRAPHIC</text><g transform="translate(1233 1011) scale(1.68)" color="#1A1A1A"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round">
